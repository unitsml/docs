name: generate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    env:
      # The image otherwise selects /setup/Gemfile and ignores this repository.
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache Metanorma assets
        uses: actions-mn/cache@v1

      # - name: Setup Flavor
      #   uses: actions-mn/setup-flavors@v1
      #   with:
      #     extra-flavors: nist
      #     github-packages-token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
      #     use-bundler: true

      - name: Install bundled dependencies
        run: bundle check || bundle install

      - name: Record documentation runtime
        run: |
          bundle exec ruby -rjson -e '
            names = %w[lutaml-model metanorma-standoc metanorma-plugin-lutaml metanorma-utils metanorma-cli]
            dependencies = Gem.loaded_specs.select { |name, _| names.include?(name) }
            puts JSON.generate(runtime: RUBY_DESCRIPTION, dependencies: dependencies.transform_values { |spec| spec.version.to_s })
          '

      - name: Metanorma generate site
        uses: actions-mn/build-and-publish@v2
        with:
          agree-to-terms: true
          destination: gh-pages
          use-bundler: true

      - name: Verify generated XML Schema documentation
        run: >-
          bundle exec ruby script/verify_xsd_documentation.rb
          sources/unitsml-xml-schema/schemas/unitsml-v1.0-csd04.xsd _site

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
